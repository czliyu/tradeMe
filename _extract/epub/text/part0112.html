  <h3 class="p1">问题59：软止损</h3>

  <p class="ziti2">下列哪项对软止损的描述是正确的：</p>

  <p class="ziti2">1.软止损对系统交易者有用</p>

  <p class="ziti2">2.对新手来说软止损是一个好的交易方式</p>

  <p class="ziti2">3.专家可以使用软止损以避免止损和不利滑点的双重打击</p>

  <p class="ziti2">4.软止损比硬止损容易设置</p>
