  <h3 class="p1">问题42：通道作为盈利目标</h3>

  <p class="ziti2">使用通道作为盈利目标的正确情形是：</p>

  <p class="ziti2">1.如果周线图涨势强劲，那么就该把盈利目标设在日线图上轨的位置</p>

  <p class="ziti2">2.上升趋势中，价格的顶底很少出现有规律的模式</p>

  <p class="ziti2">3.在上升趋势中买入的最好时机是价格触到上轨</p>

  <p class="ziti2">4.在价格达到上轨时不该卖出，因为价格可能涨得更高</p>
</body></html>
