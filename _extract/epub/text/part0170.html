  <h3 class="p1">问题103：做空期货</h3>

  <p class="ziti2">下列关于做空期货的描述哪一项不正确：</p>

  <p class="ziti2">1.做空者相当于签署了未来交付商品的合约</p>

  <p class="ziti2">2.商品期货价格的底线是商品的生产成本</p>

  <p class="ziti2">3.期货市场上的内线交易不合法</p>

  <p class="ziti2">4.商品期货价格的“天花板”是替代品的价格</p>
