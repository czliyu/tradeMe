  <div class="middle-img">
    图　P1-3　
  </div>

  <p class="ziti2">图P1-3日线走势图来自Spike网站，也是我曾经交易过一只股票的走势图，没有周线图。从图中容易看到MACD的顶背离和强力指标的顶背离。指标的数据是：做空价格90.71，平仓87.99，上轨值91.56，下轨值83.67，请问本次交易如何评价：</p>

  <p class="ziti2">1.交易水平A：超过通道差30%的盈利</p>

  <p class="ziti2">2.交易水平B：通道差20%~30%的盈利</p>

  <p class="ziti2">3.交易水平C：通道差10%~20%的盈利</p>

  <p class="ziti2">4.交易水平D：低于通道差10%的盈利</p>
