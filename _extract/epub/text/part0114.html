  <h3 class="p1">问题61：将前期低点作为止损位</h3>

  <p class="ziti2">下列哪项不是把止损设在前期低点的原因：</p>

  <p class="ziti2">1.当价格跌到前期低点时跌速通常会放缓</p>

  <p class="ziti2">2.如果股票跌到前期低点，就很可能会跌破前低</p>

  <p class="ziti2">3.如果股票跌破前期低点，可能会立即加速下跌</p>

  <p class="ziti2">4.如果把止损设在前期低点，止损后产生的滑点将大于把止损设在比前期低点低一个Tick的地方所产生的滑点</p>
</body></html>
