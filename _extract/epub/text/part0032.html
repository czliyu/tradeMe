  <h3 class="p1">问题6：趋势交易VS.反趋势交易</h3>

  <p class="ziti2">相对于反趋势交易，下列哪项不是趋势交易的优势：</p>

  <p class="ziti2">1.每次交易的高利润比例</p>

  <p class="ziti2">2.更低的费用支出</p>

  <p class="ziti2">3.有更多时间做决定</p>

  <p class="ziti2">4.低压力水平</p>
