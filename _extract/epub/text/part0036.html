  <h3 class="p1">问题10：交易纪律</h3>

  <p class="ziti2">因为市场表现出各种各样的情况，所以交易纪律是最基本的要求。关于交易纪律，下列哪项描述不正确：</p>

  <p class="ziti2">1.交易者的自控能力不强，他就更可能失败</p>

  <p class="ziti2">2.戒酒互助协会<sup class="calibre4"><a class="pcalibre pcalibre1" id="ch1" href="part0036.html#ch1-back">[1]</a></sup>为市场交易者处理情绪提供了有用的方法</p>

  <p class="ziti2">3.如果你有一个好的交易系统，纪律就不成问题</p>

  <p class="ziti2">4.恣意妄为的交易者注定是失败者</p>

  <p class="fnote"><a class="pcalibre pcalibre1" id="ch1-back" href="part0036.html#ch1">[1]</a>1935年6月，失意的股票经纪人威尔逊创立了美国戒酒互助协会（AA），全美有1.1万个成瘾治疗中心也多数以AA的“12步骤”为基础，对成瘾患者进行治疗救助。——译者注</p>
