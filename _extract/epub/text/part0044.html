  <h3 class="p1">问题18：交易记录表</h3>

  <p class="ziti2">下列哪项必须包含在交易记录表中：</p>

  <p class="ziti2">A.资产增值和净损益</p>

  <p class="ziti2">B.每次交易的等级</p>

  <p class="ziti2">C.入场价和出场价的变化</p>

  <p class="ziti2">D.每次交易想法的来源</p>

  <p class="ziti2">1.A</p>

  <p class="ziti2">2.A和B</p>

  <p class="ziti2">3.A、B和C</p>

  <p class="ziti2">4.以上所有</p>
</body></html>
