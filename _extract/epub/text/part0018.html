  <h4 class="p4">做好记录：行动比做梦更重要</h4>

  <p class="ziti2">收盘后讨论纪律很轻松，但开盘后的你，可能早已把纪律抛到九霄云外了。要想成功，就必须做好交易计划并坚定地实施。交易记录是交易成败的关键，如果持续做好交易记录，你很可能成功；如果没能坚持做交易记录，成功的机会将微乎其微。</p>
