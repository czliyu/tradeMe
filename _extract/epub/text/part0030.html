  <h3 class="p1">问题4：价格和价值</h3>

  <p class="ziti2">下列关于价格和价值之间的描述错误的是：</p>

  <p class="ziti2">1.价值变化慢，价格变化快</p>

  <p class="ziti2">2.研究收入报告和行业信息可能会让你发现价值</p>

  <p class="ziti2">3.追踪市场平均成本的移动平均可以定义价值区</p>

  <p class="ziti2">4.任何时候价格都等于价值</p>
