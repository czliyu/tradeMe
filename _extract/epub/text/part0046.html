  <h3 class="p1">问题20：交易者的日记</h3>

  <p class="ziti2">下列关于交易日记的描述哪项是正确的：</p>

  <p class="ziti2">1.如果你打算在出场后填写入场记录，那么入场前就不需要做交易记录</p>

  <p class="ziti2">2.失败的交易记录会比成功的交易记录更有教育意义</p>

  <p class="ziti2">3.必须为你最好的交易创建记录</p>

  <p class="ziti2">4.那些不能记录所有交易的活跃交易者，可以精挑细选一些特定的交易来记录</p>
</body></html>
