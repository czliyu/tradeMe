  <h3 class="p1">问题64：宽幅止损</h3>

  <p class="ziti2">下列哪项是对宽幅止损的正确描述：</p>

  <p class="ziti2">1.主要趋势的运动幅度小于回调的幅度</p>

  <p class="ziti2">2.止损越大，遭遇止损和滑点双重打击的风险越大</p>

  <p class="ziti2">3.止损属于价格运行到正常范围之外</p>

  <p class="ziti2">4.止损越大，可交易头寸越大</p>
