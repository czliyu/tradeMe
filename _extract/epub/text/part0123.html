  <h3 class="p1">问题70：因“交易噪音”卖出</h3>

  <p class="ziti2">下列关于因“交易噪音”卖出的描述不正确的一项是：</p>

  <p class="ziti2">1.系统交易者可能不会因“交易噪音”卖出</p>

  <p class="ziti2">2.主观交易者的出场时机可能早于或晚于原计划的出场时机</p>

  <p class="ziti2">3.因“交易噪音”卖出对交易新手来说非常适用</p>

  <p class="ziti2">4.因“交易噪音”卖出有损失利润的风险</p>
