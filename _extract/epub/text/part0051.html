  <h3 class="p1">问题25：玛格丽特方法</h3>

  <p class="ziti2">玛格丽特方法：把带有交易信号的图表挂在墙上，以便等待机会。下列哪项不是玛格丽特方法的优势：</p>

  <p class="ziti2">1.清晰地显示价格或指标的状态</p>

  <p class="ziti2">2.有助于你记住交易计划</p>

  <p class="ziti2">3.如果计划改变了，就把图表换下来，这样你可以及时看到新的计划</p>

  <p class="ziti2">4.把图表挂在墙上会确保你在正确的时间行动</p>
</body></html>
