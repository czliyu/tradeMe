  <h3 class="p1">问题26：交易想法的来源</h3>

  <p class="ziti2">下列哪些可能是交易想法的来源：</p>

  <p class="ziti2">A.你用指标选出的股票</p>

  <p class="ziti2">B.计算机自动选股</p>

  <p class="ziti2">C.从朋友或者交易顾问那里得到的建议</p>

  <p class="ziti2">D.媒体新闻</p>

  <p class="ziti2">1.A</p>

  <p class="ziti2">2.A和B</p>

  <p class="ziti2">3.A、B和C</p>

  <p class="ziti2">4.以上全部</p>
</body></html>
