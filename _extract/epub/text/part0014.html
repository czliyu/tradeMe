  <h4 class="p4">善待自己</h4>

  <p class="ziti2">你必须处理好自己的心态，它是你交易过程中的一部分。在交易者中，莽汉从不把自己的看法当成一回事，而其他失败者不是生搬硬套别人的看法就是异想天开。这些人一直破坏着规则，同时也打击着自己，往复循环。打击自己的人不会成为一名好的交易者。一个值得提倡的做法是：为遵守规则而取得哪怕是局部的成功而庆祝，然后清醒地盘点自己的不足。我有一套方式庆祝成功交易，但绝不在失败后惩罚自己。</p>
