  <h3 class="p1">问题9：交易心态</h3>

  <p class="ziti2">下列关于交易心态的描述哪项不正确：</p>

  <p class="ziti2">1.如果你把交易系统设置到最佳状态，你就不用担心心态问题</p>

  <p class="ziti2">2.交易者大脑不断过滤外来的信息</p>

  <p class="ziti2">3.太过主观的心态导致交易者寻找对自己有利的交易信号</p>

  <p class="ziti2">4.看涨的交易者更可能忽略下跌信号</p>
