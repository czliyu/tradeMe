  <h3 class="p1">问题15：6%规则</h3>

  <p class="ziti2">下列哪项是对6%规则的正确描述：</p>

  <p class="ziti2">1.它会在单次糟糕的交易中保护账户免遭厄运</p>

  <p class="ziti2">2.它会在一连串糟糕的交易中保护账户免遭厄运</p>

  <p class="ziti2">3.当损失开始上升时，最好的做法是交易更加积极以摆脱困境</p>

  <p class="ziti2">4.6%规则需要在进入交易后运用</p>
