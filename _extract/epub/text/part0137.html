  <h3 class="p1">问题84：组合系统</h3>

  <p class="ziti2">组合系统追踪市场运动的方向和强度。有些软件允许交易者用彩色标记K线，但即便是黑白图表上，交易者也能够通过组合系统的规则说出K线的颜色。请将下列关于组合系统的点评与图P2-7中的字母相匹配：</p>

  <div class="pic"><img alt="" class="calibre2" src="../images/00098.jpeg"/></div>

  <div class="middle-img">
    图　P2-7　
  </div>

  <p class="ziti2">1.组合系统绿色，买入或者场外等待；不允许做空</p>

  <p class="ziti2">2.组合系统红色，做空或场外等待；不允许做多</p>

  <p class="ziti2">3.组合系统蓝色，不许持有头寸</p>
