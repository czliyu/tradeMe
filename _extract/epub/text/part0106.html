  <h3 class="p1">问题53：改变止损位</h3>

  <p class="ziti2">在一次交易中，下列哪些是允许的：</p>

  <p class="ziti2">A.做多时提升止损位</p>

  <p class="ziti2">B.做空时提升止损位</p>

  <p class="ziti2">C.做空时降低止损位</p>

  <p class="ziti2">D.做多时降低止损位</p>

  <p class="ziti2">1.A和B</p>

  <p class="ziti2">2.B和C</p>

  <p class="ziti2">3.A和C</p>

  <p class="ziti2">4.C和D</p>
</body></html>
