  <h3 class="p1">问题82：处理盈利的头寸</h3>

  <div class="pic"><img alt="" class="calibre2" src="../images/00096.jpeg"/></div>

  <div class="middle-img">
    图　P2-5　
  </div>

  <p class="ziti2">交易者识别出上涨趋势，并在接近价值时买入，高于通道上轨时卖出。交易者在A点做多，B点卖出，C点做多，D点卖出，E点做多（见图P2-5）。当价格出现跳空缺口时他决定继续持有以期更多利润。当交易者处于当前市况时，哪项行动看起来更明智？</p>

  <p class="ziti2">1.卖出，落袋为安</p>

  <p class="ziti2">2.卖出一半头寸</p>

  <p class="ziti2">3.继续持有</p>

  <p class="ziti2">4.加仓</p>
