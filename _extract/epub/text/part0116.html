  <h3 class="p1">问题63：选择交易周期</h3>

  <p class="ziti2">交易结果的好坏在一定程度上取决于交易周期的选择。下列哪项不是对交易周期影响交易结果的正确描述：</p>

  <p class="ziti2">1.长期交易给交易者很多时间思考并做决策</p>

  <p class="ziti2">2.如果日内交易者不去思考，他将失败</p>

  <p class="ziti2">3.股票考察的时间越长，就运动得越远</p>

  <p class="ziti2">4.长期交易会提供最好的学习经历</p>
