  <h3 class="p1">问题91：做空的劣势</h3>

  <p class="ziti2">做空股票最大的劣势是当股票市场：</p>

  <p class="ziti2">1.持续震荡</p>

  <p class="ziti2">2.上涨相对缓慢但下跌速度较快</p>

  <p class="ziti2">3.一直上涨</p>

  <p class="ziti2">4.存在证券报升交易规则</p>
