  <h3 class="p1">问题11：处理亏损交易</h3>

  <p class="ziti2">交易者亏损时感到羞愧，下列哪项描述是正确的：</p>

  <p class="ziti2">1.在交易中，惩罚比奖励更有效</p>

  <p class="ziti2">2.如果你采取了一些正确的步骤，但有一步做错了，你应该惩罚自己</p>

  <p class="ziti2">3.成功的交易者喜欢这个游戏而非金钱</p>

  <p class="ziti2">4.不必为亏损的交易做记录</p>
</body></html>
