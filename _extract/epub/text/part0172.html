  <h3 class="p1">问题105：卖出期权</h3>

  <p class="ziti2">卖出期权比买入期权更容易获利的主要原因是：</p>

  <p class="ziti2">1.期权的时间价值</p>

  <p class="ziti2">2.大多数买入者投资资金不足</p>

  <p class="ziti2">3.期权的波动与股票不同</p>

  <p class="ziti2">4.大多数买入者是新手</p>
