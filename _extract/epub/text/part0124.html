  <h3 class="p1">问题71：新高新低指标</h3>

  <p class="ziti2">下列关于NH-NL指标的描述不正确的一项是：</p>

  <p class="ziti2">1.NH-NL创出新高，确认上涨趋势；NH-NL创出新低，确认下跌趋势</p>

  <p class="ziti2">2.NH-NL指标在顶部和底部的信号是对称的</p>

  <p class="ziti2">3.NH-NL顶背离是市场顶部到来的警示信号</p>

  <p class="ziti2">4.NH-NL尖角下跌通常表示重要的市场底部</p>
</body></html>
