  <h3 class="p1">问题72：不招人喜欢的市场行为</h3>

  <p class="ziti2">如果交易者持有多单，但不喜欢当前指标发出的高而不稳的信号，交易者的下列选择中哪一项不正确：</p>

  <p class="ziti2">1.如果是系统交易者，他就必须按照计划持有头寸</p>

  <p class="ziti2">2.如果是主观交易者，他可能会卖掉多单</p>

  <p class="ziti2">3.如果是系统交易者，他可能转而使用不同的系统以允许提早出场</p>

  <p class="ziti2">4.如果是主观交易者，他可能部分获利了结，但仍持有核心头寸</p>
</body></html>
