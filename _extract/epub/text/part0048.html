  <h3 class="p1">问题22：交易计划VS.交易日记</h3>

  <p class="ziti2">下列哪一项正确描述了交易日记和交易计划的区别：</p>

  <p class="ziti2">1.包括两个时间框架的图表</p>

  <p class="ziti2">2.图表标记了买入或卖出的信号</p>

  <p class="ziti2">3.文件名写在股票后</p>

  <p class="ziti2">4.记录买卖评分</p>
