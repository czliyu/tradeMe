  <h3 class="p1">问题48：盈利目标</h3>

  <p class="ziti2">关于设置盈利目标的描述，下列哪项是正确的：</p>

  <p class="ziti2">1.只要价格会涨，就把利润放到最大，不用担心盈利目标</p>

  <p class="ziti2">2.在任何市场都有一个完美的盈利目标</p>

  <p class="ziti2">3.交易时使用的时间框架越大，盈利目标也将越大</p>

  <p class="ziti2">4.移动平均线为任何一次交易都提供了最好的盈利目标</p>
</body></html>
