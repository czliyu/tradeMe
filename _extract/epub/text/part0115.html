  <h3 class="p1">问题62：尼克止损法</h3>

  <p class="ziti2">下列哪项是对尼克止损法的正确描述：</p>

  <p class="ziti2">1.产生最低价的K线相邻的两根K线的最低价（两个次低价），把止损设在那两个次低价中较低的那个价格之下</p>

  <p class="ziti2">2.尼克止损法对短期交易不适用</p>

  <p class="ziti2">3.尼克止损法对长期交易特别有用</p>

  <p class="ziti2">4.尼克止损法可以消除滑点</p>
</body></html>
