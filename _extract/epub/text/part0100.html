  <h3 class="p1">问题47：价格高于通道上轨</h3>

  <p class="ziti2">如果股价已经上涨到上轨之上，下列做法正确的是：</p>

  <p class="ziti2">1.交易者必须立即获利了结</p>

  <p class="ziti2">2.当价格连续两日收盘在上轨之上时，交易者必须获利了结</p>

  <p class="ziti2">3.如果价格收盘价在上轨之上，意味着上涨可能还会延续</p>

  <p class="ziti2">4.收盘价在上轨之上但没能创出新高时，交易者应该考虑在那一天卖出</p>
</body></html>
