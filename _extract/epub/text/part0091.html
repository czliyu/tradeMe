  <h3 class="p1">问题38：股价低于移动平均线的情形</h3>

  <p class="ziti2">关于股价低于移动平均线交易的情形，下列哪两项是正确的：</p>

  <p class="ziti2">A.股票低于价值时交易</p>

  <p class="ziti2">B.股价将明确地走向更低</p>

  <p class="ziti2">C.股价将明确地走向更高</p>

  <p class="ziti2">D.如果技术指标向好，做多的第一目标位应该是移动平均线</p>

  <p class="ziti2">1.A和D</p>

  <p class="ziti2">2.B和D</p>

  <p class="ziti2">3.A和C</p>

  <p class="ziti2">4.A和B</p>
