  <h3 class="p1">问题43：使用通道衡量交易表现</h3>

  <p class="ziti2">使用获得的每股利润与通道宽度的比值来衡量一次交易的表现可以帮助波段交易者：</p>

  <p class="ziti2">A.关注盈利点数的多少而不是盈利金额的多少</p>

  <p class="ziti2">B.提供了衡量交易表现的数量尺度</p>

  <p class="ziti2">C.设置现实的盈利目标</p>

  <p class="ziti2">1.A</p>

  <p class="ziti2">2.A和B</p>

  <p class="ziti2">3.以上所有</p>
</body></html>
