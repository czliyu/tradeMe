  <h3 class="p1">问题49：支撑和压力区</h3>

  <p class="ziti2">下列哪项不是长期交易者将支撑和压力区作为盈利目标的原因：</p>

  <p class="ziti2">1.成交密集区表明大量的市场参与者在那里买卖</p>

  <p class="ziti2">2.交易区间反映了大量交易者对于股票价值的认同</p>

  <p class="ziti2">3.股票震荡的时间多于股票处于趋势的时间</p>

  <p class="ziti2">4.价格运动总在震荡区间的精确的上下沿止步</p>
