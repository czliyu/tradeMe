  <h3 class="p1">问题37：止盈</h3>

  <p class="ziti2">下列哪些工具可以辅助设置盈利目标：</p>

  <p class="ziti2">A.移动平均线</p>

  <p class="ziti2">B.包络或通道线</p>

  <p class="ziti2">C.支撑和压力区</p>

  <p class="ziti2">D.其他方法</p>

  <p class="ziti2">1.A</p>

  <p class="ziti2">2.A和B</p>

  <p class="ziti2">3.A、B和C</p>

  <p class="ziti2">4.以上所有</p>
