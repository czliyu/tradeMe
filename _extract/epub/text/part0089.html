  <h3 class="p1">问题36：计划卖出</h3>

  <p class="ziti2">在买入之前，严谨的交易者不必思考下列哪项问题：</p>

  <p class="ziti2">1.股票可能涨到多少，目标止盈价格应该设在哪？</p>

  <p class="ziti2">2.股票可能会跌多少，止损位应该设在哪？</p>

  <p class="ziti2">3.股票的损益比是多少？</p>

  <p class="ziti2">4.在股价到达目标止盈价格后，我是否需要把目标位再设得远一点？</p>
</body></html>
