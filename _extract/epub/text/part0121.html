  <h3 class="p1">问题68：波幅减少止损法</h3>

  <p class="ziti2">下列关于波幅减少止损法的描述不正确的是：</p>

  <p class="ziti2">1.波幅减少法确保每次交易都能获得更多的利润</p>

  <p class="ziti2">2.这种方法允许交易者以合理的盈利目标开始交易，但在交易时获得更多</p>

  <p class="ziti2">3.使用波幅减少法会有损失部分浮盈的风险</p>

  <p class="ziti2">4.使用这种方法就是让市场决定交易者能获取多少利润</p>
</body></html>
