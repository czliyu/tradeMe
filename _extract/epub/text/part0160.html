  <h3 class="p1">问题93：做空VS.做多</h3>

  <p class="ziti2">下列关于做多和做空比较的描述哪一项是正确的：</p>

  <p class="ziti2">1.形成顶部所花的时间比形成底部所花的时间长</p>

  <p class="ziti2">2.股票底部建立在希望和贪婪的基础上</p>

  <p class="ziti2">3.做多的时机比做空的时机更重要</p>

  <p class="ziti2">4.恐惧情绪在市场顶部时占主导地位</p>
