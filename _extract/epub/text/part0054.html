  <h3 class="p1">问题28：给已经完成的交易评分</h3>

  <p class="ziti2">下列哪项是对已经完成的交易评分的正确描述：</p>

  <p class="ziti2">1.赚钱多少是衡量交易好坏的方式</p>

  <p class="ziti2">2.长期交易者可以用通道来衡量交易质量</p>

  <p class="ziti2">3.交易者获利超过通道的30%获得评级A</p>

  <p class="ziti2">4.交易者获利少于通道的20%获得评级D</p>
