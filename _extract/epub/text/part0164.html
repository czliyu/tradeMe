  <h3 class="p1">问题97：依据基本面信息做空</h3>

  <p class="ziti2">下列关于依据基本面信息做空的描述正确的一项是：</p>

  <p class="ziti2">1.基本面分析者分析市场的范围比技术分析者大</p>

  <p class="ziti2">2.交易者可以使用技术分析作为交易想法的来源，基本面信息作为交易的触发器</p>

  <p class="ziti2">3.基本面信息优先于技术要素</p>

  <p class="ziti2">4.最强有力的状况是当基本面信息支持某次交易的同时技术给出确认信号</p>
</body></html>
