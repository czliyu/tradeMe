  <h3 class="p1">问题40：卖出时的后悔情绪</h3>

  <p class="ziti2">交易者以EMA作为盈利目标卖出后，价格继续上涨时他会后悔，下列哪一项是正确的：</p>

  <p class="ziti2">1.后悔是有益的，因为它会刺激你下次卖出时认真思考、不要太快出局</p>

  <p class="ziti2">2.过早出局的强烈后悔情绪会导致下次交易持仓过久</p>

  <p class="ziti2">3.如果分析得当，你应该对盈利目标位和市场有新的认识，从而不会过早卖出</p>

  <p class="ziti2">4.不设止盈是失败者的标志之一</p>
</body></html>
