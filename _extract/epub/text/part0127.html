  <h3 class="p1">问题74：市场警钟</h3>

  <p class="ziti2">下列哪种情况下市场会发出警钟：</p>

  <p class="ziti2">1.创出年度新高</p>

  <p class="ziti2">2.创出年度新低</p>

  <p class="ziti2">3.市场中发生了非常不正常的事情</p>

  <p class="ziti2">4.市场发出了所有人都可以识别的信号</p>
