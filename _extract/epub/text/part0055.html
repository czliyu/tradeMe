  <h3 class="p1">问题29：价值型交易VS.动量型交易之买入</h3>

  <p class="ziti2">对买入的描述，下列哪项是错误的：</p>

  <p class="ziti2">1.价值型交易的纪律是“低买高卖”</p>

  <p class="ziti2">2.动量型交易的纪律是“高买、更高卖”</p>

  <p class="ziti2">3.走势图中的上轨显示市场情绪低谷水平，下轨显示市场情绪高涨水平</p>

  <p class="ziti2">4.动量型交易会在市场快速运动的趋势中表现得更好</p>
</body></html>
