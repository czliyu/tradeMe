  <h3 class="p1">问题73：业绩报告</h3>

  <p class="ziti2">下列关于业绩报告对价格影响的描述不正确的一项是：</p>

  <p class="ziti2">1.盈利预期驱动价格大幅波动</p>

  <p class="ziti2">2.业绩报告从不改变股票的长期趋势</p>

  <p class="ziti2">3.对职业交易者来说盈利报告很少出现惊喜</p>

  <p class="ziti2">4.内幕交易通常与公司经营方式有关</p>
