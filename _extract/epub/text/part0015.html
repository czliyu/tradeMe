  <h4 class="p4">有些交易者注定要失败</h4>

  <p class="ziti2">市场会产生无尽的诱惑，形形色色的人在市场中交易，酗酒和吸毒的人都不太可能成功。他们可能会侥幸赢得一些交易，但从长期来看，他们几乎没有获胜的希望。如果你有这些毛病，在没改掉这些毛病之前，最好不要交易。</p>
