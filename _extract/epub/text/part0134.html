  <h3 class="p1">问题81：持仓不变、加仓或者获利了结</h3>

  <div class="pic"><img alt="" class="calibre2" src="../images/00095.jpeg"/></div>

  <div class="middle-img">
    图　P2-4　
  </div>

  <p class="ziti2">图P2-4中，A点时，股票跌到58.78美元，B点时股票跌到58.71美元，但很快又从新低点涨了回来。假突破伴随着几个指标的底背离。如果交易者做多并以接近通道上轨价格为盈利目标位，当交易者处在当前市况时，下列哪项行为是合理的：</p>

  <p class="ziti2">A.卖出，落袋为安</p>

  <p class="ziti2">B.卖出一半、持有一半</p>

  <p class="ziti2">C.继续持有并收紧止损</p>

  <p class="ziti2">D.加仓</p>

  <p class="ziti2">1.A</p>

  <p class="ziti2">2.A或B</p>

  <p class="ziti2">3.A、B或C</p>

  <p class="ziti2">4.以上所有</p>
</body></html>
