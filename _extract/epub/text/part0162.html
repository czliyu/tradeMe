  <h3 class="p1">问题95：下跌趋势中做空</h3>

  <p class="ziti2">下列关于下跌趋势中做空的描述哪一项是正确的：</p>

  <p class="ziti2">1.在通道中做空意味着做空高估的股票</p>

  <p class="ziti2">2.在接近通道下轨时买入意味着以低于价值买入</p>

  <p class="ziti2">3.在通道内只有一个好的做空机会</p>

  <p class="ziti2">4.使用通道百分比给交易评分不适用于做空</p>
