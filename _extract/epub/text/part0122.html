  <h3 class="p1">问题69：市场中的“交易噪音”</h3>

  <p class="ziti2">因“交易噪音”而卖出的原因是：</p>

  <p class="ziti2">1.达到盈利目标</p>

  <p class="ziti2">2.被打止损</p>

  <p class="ziti2">3.交易者希望部分获利了结</p>

  <p class="ziti2">4.交易者不喜欢市场运行的方式</p>
