  <h3 class="p1">问题60：比前期最低价低一个Tick的止损</h3>

  <p class="ziti2">把止损设得比前期最低价低一个Tick，这样的止损有问题，下列哪项不是产生问题的原因：</p>

  <p class="ziti2">1.可能在市场接近前期最低时，很小的一个卖单都会让价格再创新低</p>

  <p class="ziti2">2.如果市场以很小的成交量跌破前低并反转向上，这是牛市模式</p>

  <p class="ziti2">3.职业交易者喜欢在此时接盘</p>

  <p class="ziti2">4.一旦跌破前期低点，价格可能会跌得更低</p>
</body></html>
