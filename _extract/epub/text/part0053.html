  <h3 class="p1">问题27：给买入和卖出评分</h3>

  <p class="ziti2">关于给买入和卖出评分的描述，下列哪项是错误的：</p>

  <p class="ziti2">1.买入价和最低价距离越近，评分越高</p>

  <p class="ziti2">2.卖出价和最低价距离越近，评分越高</p>

  <p class="ziti2">3.在中点之上卖出，就会有一个不错的评分</p>

  <p class="ziti2">4.在当天价格的最低1/4部分买入会获得一个很好的评分</p>
</body></html>
