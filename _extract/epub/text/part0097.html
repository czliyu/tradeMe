  <h3 class="p1">问题44：做多的盈利目标</h3>

  <p class="ziti2">将A、B两种情况与1、2中多单的盈利目标相匹配：</p>

  <p class="ziti2">A.市场离开低点后展开一波上涨的第一盈利目标</p>

  <p class="ziti2">B.正在上涨的趋势中的第一盈利目标</p>

  <p class="ziti2">1.在价值区或低于价值区，由移动平均线确定</p>

  <p class="ziti2">2.接近由上轨线确定的高估区</p>
