  <h3 class="p1">问题35：三种类型的卖出</h3>

  <p class="ziti2">三种逻辑性的卖出方法中，不包括下列哪一项：</p>

  <p class="ziti2">1.高于市场价的盈利目标位卖出</p>

  <p class="ziti2">2.低于市场价的止损位卖出</p>

  <p class="ziti2">3.因市场状况改变的“因交易噪音”而卖出</p>

  <p class="ziti2">4.因感到对交易没有耐心而卖出</p>
