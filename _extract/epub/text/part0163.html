  <h3 class="p1">问题96：下跌趋势中的策略</h3>

  <p class="ziti2">关于下跌趋势中做空的描述不正确的是：</p>

  <p class="ziti2">1.在周线图上做战略决策，日线图中做战术计划</p>

  <p class="ziti2">2.在通道下轨附近处做空有风险也有回报</p>

  <p class="ziti2">3.在通道内做空增加双重打击的风险</p>

  <p class="ziti2">4.单纯在通道内做空不会抓住价格的主要趋势</p>
