  <h3 class="p1">问题110：外汇市场</h3>

  <p class="ziti2">下列哪项不符合外汇市场特征：</p>

  <p class="ziti2">1.长期趋势最明显的市场</p>

  <p class="ziti2">2.价格很大程度上由政府的政策基本面驱动</p>

  <p class="ziti2">3.外汇易于做出计划并展开交易</p>

  <p class="ziti2">4.基本上是24小时交易</p>
