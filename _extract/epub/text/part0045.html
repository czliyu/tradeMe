  <h3 class="p1">问题19：交易错误</h3>

  <p class="ziti2">下列哪项对交易错误的描述不正确：</p>

  <p class="ziti2">1.聪明的人不会犯错</p>

  <p class="ziti2">2.当你学习和探索时错误不可避免</p>

  <p class="ziti2">3.冲动是重复犯错的标志</p>

  <p class="ziti2">4.保持交易记录会让你从错误中得到学习</p>
</body></html>
