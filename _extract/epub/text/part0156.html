  <h3 class="p1">问题89：做空的影响</h3>

  <p class="ziti2">做空股票会使市场更有秩序，下列哪项不是做空股票的正面影响：</p>

  <p class="ziti2">1.抑制价格过度上涨</p>

  <p class="ziti2">2.减缓价格暴跌</p>

  <p class="ziti2">3.增加价格波动</p>

  <p class="ziti2">4.抑制价格大幅波动</p>
</body></html>
