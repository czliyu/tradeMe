  <h3 class="p1">问题14：变形的2%规则</h3>

  <p class="ziti2">一个经验老手用200万美元进行交易并使用变形的2%的资金管理规则，他每次交易的风险上限是0.25%。股票当前报价9美元，他准备买入，并预期该股上升至12美元，止损设在8美元，他最大可以买多少股？</p>

  <p class="ziti2">1.2 000</p>

  <p class="ziti2">2.4 500</p>

  <p class="ziti2">3.5 000</p>

  <p class="ziti2">4.12 000</p>
