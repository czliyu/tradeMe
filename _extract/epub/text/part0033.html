  <h3 class="p1">问题7：系统交易VS.主观交易</h3>

  <p class="ziti2">相对于主观交易，下列哪项不是系统交易的优势：</p>

  <p class="ziti2">1.提前知道盈利和损失的期望值</p>

  <p class="ziti2">2.每次交易中的情感因素更少</p>

  <p class="ziti2">3.更加自由</p>

  <p class="ziti2">4.系统交易方法是处理市场不确定性的一种方法</p>
