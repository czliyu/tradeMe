  <h3 class="p1">问题41：EMA作为盈利目标</h3>

  <p class="ziti2">使用EMA作为盈利目标的最好时机是：</p>

  <p class="ziti2">1.当价格从熊市底部反弹展开上涨时</p>

  <p class="ziti2">2.在上涨趋势中</p>

  <p class="ziti2">3.当价格接近历史最高价时</p>

  <p class="ziti2">4.以上所有</p>
