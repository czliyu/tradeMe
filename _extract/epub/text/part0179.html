  <h3 class="p1">问题112：强力指标的交易信号</h3>

  <div class="pic"><img alt="" class="calibre2" src="../images/00148.jpeg"/></div>

  <div class="middle-img">
    图　P3-1　
  </div>

  <p class="ziti2">从图P3-1中可以看到强力指标的尖角下跌（用实线箭头标记），转天股价趋于见底。图中还标注了强力指标的尖角上涨（虚线箭头），转天通常是继续上涨而非调整。这种不同表明：</p>

  <p class="ziti2">1.强力指标只在下跌趋势中有效</p>

  <p class="ziti2">2.强力指标只在上涨趋势中有效</p>

  <p class="ziti2">3.上涨和下跌不对称，所以交易也不同</p>

  <p class="ziti2">4.交易者在熊市中可以使用这个指标进行交易</p>
