  <h3 class="p1">问题67：使用安全区止损法</h3>

  <p class="ziti2">下列关于安全区止损的描述哪一项不正确：</p>

  <p class="ziti2">1.安全区是机械交易系统</p>

  <p class="ziti2">2.交易者必须建立安全区的回测期</p>

  <p class="ziti2">3.交易者必须选择噪音系数以求得安全区止损位</p>

  <p class="ziti2">4.通常系数在2和3之间时交易就非常安全了</p>
