  <h3 class="p1">问题56：上一次交易的影响</h3>

  <p class="ziti2">前一次交易的头寸大小如何影响下一次交易？</p>

  <p class="ziti2">1.在一次获利交易后增加交易规模</p>

  <p class="ziti2">2.在一次没有获利的交易后减少交易规模</p>

  <p class="ziti2">3.在一次没有获利的交易后增加交易规模</p>

  <p class="ziti2">4.以上都不是</p>
