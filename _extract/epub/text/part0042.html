  <h3 class="p1">问题16：每次交易的两个重要目标</h3>

  <p class="ziti2">下列哪两项是每次交易的两个最重要的目标：</p>

  <p class="ziti2">1.赚钱和试验新系统</p>

  <p class="ziti2">2.面对挑战和享受成功的感觉</p>

  <p class="ziti2">3.赚钱和成为更好的交易者</p>

  <p class="ziti2">4.检验你的纪律性和实施计划的能力</p>
