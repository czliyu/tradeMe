  <h3 class="p1">问题66：安全区止损</h3>

  <p class="ziti2">下列哪项是对安全区止损的正确描述：</p>

  <p class="ziti2">1.它的原理就像过滤器，过滤了趋势信号</p>

  <p class="ziti2">2.如果今日价格波动不在前日价格波动之内，这就是噪音</p>

  <p class="ziti2">3.上涨趋势的安全区是追踪平均上突破噪音，下跌趋势的安全区是追踪平均下突破噪音</p>

  <p class="ziti2">4.安全区方法在趋势行情中运行最好，在震荡行情中运行最糟</p>
</body></html>
