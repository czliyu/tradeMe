  <h3 class="p1">问题5：基本面分析和技术分析</h3>

  <p class="ziti2">下列关于基本面分析和技术分析描述错误的是：</p>

  <p class="ziti2">1.基本面分析师计算上市公司的商业价值</p>

  <p class="ziti2">2.只要有精确的基本面数据就可以计算出股价变动的具体方向</p>

  <p class="ziti2">3.技术分析者在价格历史数据中寻找重复的模式</p>

  <p class="ziti2">4.纯技术分析者不关心公司的收入和新闻，他只关心股票历史走势和股票报价</p>
</body></html>
