  <h3 class="p1">问题50：保护性止损</h3>

  <p class="ziti2">使用保护性止损让很多事情变得有意义，其中不包括下列哪一项：</p>

  <p class="ziti2">1.这是现实的成本，提醒交易者价格可能会走向于己不利的一面</p>

  <p class="ziti2">2.当人们“爱上”股票时，它与所有权效应是对立的</p>

  <p class="ziti2">3.在已经开始的交易中，这会让交易者减轻精神压力</p>

  <p class="ziti2">4.在一次交易中使用保护性止损意味着交易者损失的金钱数量正好和计划的损失一样多</p>
