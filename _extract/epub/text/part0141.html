  <h3 class="p1">评分</h3>

  <p class="ziti2">46~53：优秀。你已经掌握了卖出的所有要点，现在可以进入下一章做空的学习了。</p>

  <p class="ziti2">38~45：相当好。成功的交易需要顶级的表现，在进入下一章学习之前，仔细检查做错的题，复习其中的知识点，几天后重新做一遍测试题。</p>

  <p class="ziti2">低于38分：警示！在其他专业领域不是前三是可以接受的，但在交易中决不能接受。在开始交易之前，你必须加倍努力地学习。请继续学习本书第二部分并重新做测试题。如果第二次测试仍然得分很低，在重新测试之前，仔细查看本章的建议。</p>
