  <h3 class="p1">问题90：做空VS.做多</h3>

  <p class="ziti2">与做多相比，做空的主要优势是：</p>

  <p class="ziti2">1.顶比底容易识别</p>

  <p class="ziti2">2.股票下跌的速度比上涨的速度快</p>

  <p class="ziti2">3.在上涨中卖出比在下跌中买入更容易</p>

  <p class="ziti2">4.股票上涨的速度比下跌的速度快</p>
</body></html>
