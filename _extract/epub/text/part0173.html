  <h3 class="p1">问题106：卖出存量期权</h3>

  <p class="ziti2">卖出存量期权的主要劣势是：</p>

  <p class="ziti2">1.如果股价平稳，交易者将无利可图</p>

  <p class="ziti2">2.如果股票下跌，股票上的多头头寸将遭受损失</p>

  <p class="ziti2">3.如果股价上涨超过执行价格，将会被执行</p>

  <p class="ziti2">4.卖出存量期权需要大量资本</p>
