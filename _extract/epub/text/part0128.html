  <h3 class="p1">问题75：依据NH-NL指标进行交易</h3>

  <p class="ziti2">下列关于NH-NL指标的描述不正确的一项是：</p>

  <p class="ziti2">1.当NH-NL指标在零轴之上时表示牛市比熊市强烈</p>

  <p class="ziti2">2.新高表示当前的主要趋势是弱势，新低表示当前主要趋势是强势</p>

  <p class="ziti2">3.顶背离在牛市结束时通常会看到</p>

  <p class="ziti2">4.周线NH-NL指标的严重尖角下跌通常表示市场见底</p>
</body></html>
