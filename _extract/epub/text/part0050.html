  <h3 class="p1">问题24：点评</h3>

  <p class="ziti2">下列哪项不是进行点评的原因：</p>

  <p class="ziti2">1.提醒你持仓多长时间</p>

  <p class="ziti2">2.便于观察当前持仓是浮盈还是浮亏状态</p>

  <p class="ziti2">3.便于追踪盈利目标和止损</p>

  <p class="ziti2">4.衡量你的交易表现</p>
