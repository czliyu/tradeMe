  <h3 class="p1">问题39：移动平均线作为止盈目标</h3>

  <p class="ziti2">下列哪项不是对使用移动平均线作为盈利目标的正确描述：</p>

  <p class="ziti2">1.使用移动平均线卖出的方法不错，尤其是在周线图上</p>

  <p class="ziti2">2.股价经常在移动平均线上下震荡</p>

  <p class="ziti2">3.止盈空间比止损空间大的做法非常可取</p>

  <p class="ziti2">4.以止盈价卖出时，卖出评分不重要</p>
</body></html>
