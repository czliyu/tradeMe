  <h3 class="p1">问题100：依据空头持仓比率交易</h3>

  <p class="ziti2">追踪空头持仓比率可以为交易者带来诸多好处，下列哪项不包括在内：</p>

  <p class="ziti2">1.空头持仓比率上升是对下跌趋势的一种确认</p>

  <p class="ziti2">2.空头持仓比率超过20%是个警示，表明股价可能剧烈反弹</p>

  <p class="ziti2">3.空头持仓比率低于10%意味着做空相对安全</p>

  <p class="ziti2">4.空头持仓比率下降表明股价即将下跌</p>
