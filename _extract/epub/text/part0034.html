  <h3 class="p1">问题8：技术工具箱</h3>

  <p class="ziti2">技术交易者用技术工具指导买卖，下列哪项描述是正确的：</p>

  <p class="ziti2">1.寻找那些能给你想要的指示信号的工具是正确的做法</p>

  <p class="ziti2">2.工具越多，工具箱越好</p>

  <p class="ziti2">3.“五颗子弹规则”允许你只能使用5个指标</p>

  <p class="ziti2">4.知名的指标就是最好的指标，交易者都应该使用那些知名的指标</p>
