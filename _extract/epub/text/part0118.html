  <h3 class="p1">问题65：移动止损</h3>

  <p class="ziti2">下列关于移动止损的描述不正确的一项是：</p>

  <p class="ziti2">1.你只能按照交易的方向移动止损，绝不能相反</p>

  <p class="ziti2">2.当价格达到盈利目标位时使用追踪止损就增加了风险</p>

  <p class="ziti2">3.当股价在止损位之上徘徊时，把止损价再降低一些对减少双重打击的风险有意义</p>

  <p class="ziti2">4.当价格变动有利时，提高止损以保护部分纸上利润有意义</p>
