  <h3 class="p1">问题99：空头持仓比率</h3>

  <p class="ziti2">空头持仓比率如何反映做空的强烈程度：</p>

  <p class="ziti2">1.做空者持有的空头头寸与可做空股票之间的关系</p>

  <p class="ziti2">2.某个交易者做空的股票与其做多的股票之间的关系</p>

  <p class="ziti2">3.在某只股票上的空头头寸与该股上的多头头寸之间的关系</p>

  <p class="ziti2">4.交易者账户中做空的资金与总资金之间的关系</p>
</body></html>
