  <h3 class="p1">问题51：突破阻力位</h3>

  <p class="ziti2">如果股票上涨到阻力位后短暂停留，然后再度上涨并突破阻力位，这给我们的信号是：</p>

  <p class="ziti2">A.立即做多</p>

  <p class="ziti2">B.如果股票跌回阻力区就准备做空</p>

  <p class="ziti2">C.立即做空</p>

  <p class="ziti2">D.如果股价回调到阻力位附近就准备做多</p>

  <p class="ziti2">1.A或D</p>

  <p class="ziti2">2.A或B</p>

  <p class="ziti2">3.B或C</p>

  <p class="ziti2">4.C或D</p>
</body></html>
