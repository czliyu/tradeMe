  <h4 class="p4">处于糟糕情绪中时最好不要交易</h4>

  <p class="ziti2">即便是一个优秀的交易者，也只有一个“很窄”的优势，任何减少这种优势的事情都会打破市场与优势之间的平衡。保持轻松的状态对交易成功非常重要，如果有非常严重的牙疼或者与配偶之间产生问题转移了你的注意力，你最好停止交易；如果你感觉自己患得患失，在从这种压力中释放出来之前，也最好不要交易。</p>
