  <h3 class="p1">问题94：顶部做空</h3>

  <p class="ziti2">下列关于顶部做空的描述哪一项不正确：</p>

  <p class="ziti2">1.因为波动比较剧烈，所以止损应该相对较大</p>

  <p class="ziti2">2.宽幅止损需要重仓交易</p>

  <p class="ziti2">3.被打止损后，重新入场无可厚非</p>

  <p class="ziti2">4.交易比资金管理规则允许的头寸更小的头寸会增加持仓信心</p>
