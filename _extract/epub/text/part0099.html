  <h3 class="p1">问题46：一波上涨的顶部</h3>

  <p class="ziti2">对一波上涨顶部最高价的描述正确的是：</p>

  <p class="ziti2">1.预测最高价为卖出提供了合理的盈利目标</p>

  <p class="ziti2">2.经常预测顶部的人可以准确预测顶部</p>

  <p class="ziti2">3.试图在顶部最高价卖出可能会付出昂贵代价</p>

  <p class="ziti2">4.如果交易者可以经常卖在顶部最高价，他也可以在那里做空</p>
